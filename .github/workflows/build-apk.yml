name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk server-status.apk

      - uses: actions/upload-artifact@v4
        with:
          name: server-status-apk
          path: server-status.apk

      # Fixed download link for the phone: Releases → "latest-build" → server-status.apk
      - name: Publish to release "latest-build"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Neuester Build
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: "Debug-APK aus ${{ github.ref_name }} @ ${{ github.sha }}"
          files: server-status.apk
